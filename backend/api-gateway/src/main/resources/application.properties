spring.application.name=gateway
server.port=8100

#config server - disabled for local development
#spring.config.import=http://localhost:8888
#spring.profiles.active=dev
spring.cloud.config.enabled=false

#eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true  

# Distributed Tracing - Micrometer only (Sleuth is deprecated)
spring.zipkin.base-url=http://localhost:9411
management.tracing.sampling.probability=1.0

# Gateway Routes — defined in GatewayRouteConfig.java (Spring Cloud Gateway Server WebMVC 2025+)
# Legacy spring.cloud.gateway.routes[] prefix is NOT used by server-webmvc module

# CORS Configuration for Frontend
spring.cloud.gateway.server.webmvc.cors.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:3001,http://localhost:5173
spring.cloud.gateway.server.webmvc.cors.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webmvc.cors.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webmvc.cors.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webmvc.cors.globalcors.corsConfigurations.[/**].exposedHeaders=Authorization,Content-Type

# Resilience4J Configuration
resilience4j.circuitbreaker.instances.authBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.companyBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.companyBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.jobBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.jobBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.jobBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.jobBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.reviewBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reviewBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reviewBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.reviewBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.applicationBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.applicationBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.applicationBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.applicationBreaker.failureRateThreshold=50

# Logging
logging.level.root=info
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JWT — must match auth-service secret exactly
jwt.secret=${JWT_SECRET:jobflow-super-secret-key-2024-tajinder-singh-microservices}