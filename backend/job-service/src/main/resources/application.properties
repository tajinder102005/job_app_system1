spring.application.name=job-service
server.port=8099

spring.cloud.config.enabled=false

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/jobapp}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Singh@123}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka — enabled so the gateway's lb("job-service") can discover this service
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Feign / Circuit Breaker
feign.circuitbreaker.enabled=true

# Actuator
management.endpoints.web.exposure.include=*

# File upload & Object Storage
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
resume.upload.dir=./uploads/resumes

# Cloud Object Storage Configuration (local | supabase)
storage.type=${STORAGE_TYPE:supabase}
supabase.url=${SUPABASE_URL:https://nhljemjccwxldmauivde.supabase.co}
supabase.key=${SUPABASE_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obGplbWpjY3d4bGRtYXVpdmRlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTgyMDg3MiwiZXhwIjoyMTA1Mzk2ODcyfQ.uVN2x9aNzjrA2WxWyWDWSH_pLeK1LIkD3c3KkilR2fc}
supabase.bucket=${SUPABASE_BUCKET:resumes}

# RabbitMQ exchanges
rabbitmq.exchange.job=job.exchange
rabbitmq.exchange.notification=notification.exchange

management.endpoint.health.show-details=always
management.health.defaults.enabled=true
