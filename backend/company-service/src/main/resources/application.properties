spring.application.name=company-service
server.port=8082

spring.cloud.config.enabled=false

# Database Configuration (Defaults to H2 in-memory, overrides to PostgreSQL/Supabase when SPRING_DATASOURCE_URL is set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:companydb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka (Disabled for simplicity)
eureka.client.enabled=false

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always
