spring.application.name=notification-service
server.port=8089

# Eureka Client
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notificationdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Singh@123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email Configuration
# For production, configure with your SMTP provider (Gmail, SendGrid, AWS SES, etc.)
# Example for Gmail (requires App Password): https://myaccount.google.com/apppasswords
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:tajindersingh.dev@gmail.com}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:ziiybjipcvbwclvn}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# RabbitMQ (Enabled for event-driven notifications)
spring.rabbitmq.enabled=true
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# RabbitMQ Notification Exchange and Queues
rabbitmq.exchange.notification=notification.exchange
rabbitmq.queue.user.registered=user.registered.queue
rabbitmq.queue.recruiter.pending=recruiter.pending.queue
rabbitmq.queue.recruiter.approved=recruiter.approved.queue
rabbitmq.queue.application.submitted=application.submitted.queue
rabbitmq.queue.application.shortlisted=application.shortlisted.queue
rabbitmq.queue.interview.scheduled=interview.scheduled.queue
rabbitmq.queue.application.rejected=application.rejected.queue

# Logging
logging.level.com.tajfolio.notification=DEBUG
