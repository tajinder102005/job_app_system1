<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Recruiter Request Pending</title></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
        <h2 style="color: #FF9800;">Recruiter Request Received</h2>
        <p>Hi <strong th:text="${name}"></strong>,</p>
        <p>Your request to become a recruiter on JobFlow has been received and is pending admin approval.</p>
        <p>You will be notified once your request is reviewed. This typically takes 1-2 business days.</p>
        <p>Best regards,<br>The JobFlow Team</p>
    </div>
</body>
</html>
