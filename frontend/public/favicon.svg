<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4338ca" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Dynamic JobFlow Bolt -->
  <path d="M35 10 L19 33 L31 33 L27 54 L45 28 L33 28 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="1"
        stroke-linejoin="round"/>
</svg>
