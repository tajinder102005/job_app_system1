services:
  # ── Eureka Service Registry ──────────────────────────────
  - type: web
    name: service-registry
    env: docker
    dockerfilePath: ./backend/service-registry/Dockerfile
    dockerContext: ./backend/service-registry
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8761
      - key: EUREKA_CLIENT_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_CLIENT_FETCH_REGISTRY
        value: "false"

  # ── API Gateway ──────────────────────────────────────────
  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8100
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE
        value: http://service-registry:8761/eureka/
      - key: JWT_SECRET
        value: jobflow-super-secret-key-2024-tajinder-singh-microservices

  # ── Auth Microservice ────────────────────────────────────
  - type: web
    name: auth-service
    env: docker
    dockerfilePath: ./backend/auth-service/Dockerfile
    dockerContext: ./backend/auth-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8088
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE
        value: http://service-registry:8761/eureka/
      - key: JWT_SECRET
        value: jobflow-super-secret-key-2024-tajinder-singh-microservices

  # ── Job & Application Microservice ───────────────────────
  - type: web
    name: job-service
    env: docker
    dockerfilePath: ./backend/job-service/Dockerfile
    dockerContext: ./backend/job-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8099
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE
        value: http://service-registry:8761/eureka/
      - key: STORAGE_TYPE
        value: supabase
      - key: SUPABASE_URL
        value: https://nhljemjccwxldmauivde.supabase.co
      - key: SUPABASE_BUCKET
        value: resumes
