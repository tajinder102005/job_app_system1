    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8088
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE
        value: http://service-registry:8761/eureka/
      - key: JWT_SECRET
        value: jobflow-super-secret-key-2024-tajinder-singh-microservices
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.nhljemjccwxldmauivde.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        value: Rednijat@123

